version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: marks_postgres
    environment:
      POSTGRES_USER: marks_user
      POSTGRES_PASSWORD: marks_pass_123
      POSTGRES_DB: marks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marks_user -d marks_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/MarksApi/Dockerfile
    container_name: marks_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=marks_db;Username=marks_user;Password=marks_pass_123"
      Jwt__Key: "ThisIsASecretKeyForMarksApiJwtAuth2026SecureKey!"
      Jwt__Issuer: "MarksApi"
      Jwt__Audience: "MarksApiUsers"

volumes:
  postgres_data:
